[project]
name = "openapi-pyx"
version = "0.1.0a1"
description = "OpenAPI 3.1 → Python client generator. Pydantic v2 + httpx + async."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
keywords = [
  "openapi",
  "openapi-3.1",
  "code-generation",
  "pydantic",
  "httpx",
  "async",
  "client",
  "sdk",
]
authors = [{ name = "Oliver Haas", email = "ohaas@e1plus.de" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "datamodel-code-generator>=0.68.1",
  "httpx>=0.28",
  "openapi-pydantic>=0.5.1",
  "pydantic[email]>=2.13.4",
  "PyYAML>=6",
  "ruff>=0.15.20",
  "typer>=0.26.8",
]

[project.urls]
Homepage = "https://github.com/oliverhaas/openapi-pyx"
Repository = "https://github.com/oliverhaas/openapi-pyx.git"

[project.scripts]
openapi-pyx = "openapi_pyx.cli:app"

[dependency-groups]
dev = [
  "pre-commit==4.6.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "ruff==0.15.20",
  "ty==0.0.56",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openapi_pyx"]

[tool.hatch.build.targets.sdist]
include = ["openapi_pyx", "LICENSE", "README.md"]

[tool.ruff]
target-version = "py314"
line-length = 120
fix = true
extend-exclude = ["tests/fixtures/golden/**"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D", "E501", "EM", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN",
  "ARG",
  "F841",
  "FBT",
  "PLR2004",
  "PT006",
  "PT011",
  "PT013",
  "PT018",
  "S101",
  "S105",
]

[tool.ty.environment]
python-version = "3.14"

[[tool.ty.overrides]]
include = ["tests/**"]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[tool.pytest.ini_options]
addopts = "--cov=openapi_pyx --cov-report=term-missing --cov-report=xml --no-cov-on-fail"
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
precision = 2
skip_covered = true
