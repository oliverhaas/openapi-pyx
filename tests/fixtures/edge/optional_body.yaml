openapi: 3.1.0
info:
  title: OptionalBody
  version: 1.0.0
paths:
  /pets:
    put:
      tags: [pets]
      operationId: updatePet
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "204":
          description: ok
components:
  schemas:
    Pet:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        name:
          type: string
